[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diva_live_helper"]

[project]
name = "diva-live-helper"
version = "0.1.0"
description = "B站直播点歌助手 - 自动读取直播间弹幕，解析点歌命令，在游戏中选择歌曲"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "blivedm>=0.1.1",
    "keyboard>=0.13.5",
    "openai>=2.38.0",
    "psutil>=7.2.2",
    "pymem>=1.14.0",
]

[project.scripts]
diva-live-helper = "diva_live_helper.main:main"
update_db        = "diva_live_helper.tools.update_db:main"
diva-translate   = "diva_live_helper.tools.translate:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
]
